name: Publish Docker image

on:
  push:
    tags: ['*']

permissions:
  contents: write
  packages: write

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Prepare build metadata
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = branch ]; then
            frontend_ref=dev-build
            branch=dev
          else
            frontend_ref=$(tr -d '[:space:]' < .frontend-version)
            branch=main
          fi
          test -n "$frontend_ref"
          echo "frontend_ref=$frontend_ref" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          frontend_commit=$(gh api "repos/Fedarisha/frontend/commits/$frontend_ref" --jq .sha)
          echo "frontend_commit=$frontend_commit" >> "$GITHUB_OUTPUT"
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            FRONTEND_URL=https://github.com/Fedarisha/frontend/releases/download/${{ steps.meta.outputs.frontend_ref }}/remnawave-frontend.zip
            BRANCH=${{ steps.meta.outputs.branch }}
            __RW_METADATA_GIT_BRANCH=${{ steps.meta.outputs.branch }}
            __RW_METADATA_BUILD_TIME=${{ steps.meta.outputs.build_time }}
            __RW_METADATA_BUILD_NUMBER=${{ github.run_number }}
            __RW_METADATA_VERSION=${{ steps.meta.outputs.version }}
            __RW_METADATA_GIT_BACKEND_COMMIT=${{ github.sha }}
            __RW_METADATA_GIT_FRONTEND_COMMIT=${{ steps.meta.outputs.frontend_commit }}
          outputs: type=image,name=ghcr.io/fedarisha/backend,push-by-digest=true,name-canonical=true,push=true
      - name: Save digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish multiarch image
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags=(-t "ghcr.io/fedarisha/backend:$GITHUB_REF_NAME")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tags+=(-t ghcr.io/fedarisha/backend:latest -t ghcr.io/fedarisha/backend:3)
          fi
          docker buildx imagetools create "${tags[@]}" $(
            for digest in *; do
              printf 'ghcr.io/fedarisha/backend@sha256:%s ' "$digest"
            done
          )
      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Mirror to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        run: |
          tags=(-t "voltara13/backend:$GITHUB_REF_NAME")
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tags+=(-t voltara13/backend:latest -t voltara13/backend:3)
          fi
          docker buildx imagetools create "${tags[@]}" "ghcr.io/fedarisha/backend:$GITHUB_REF_NAME"
      - name: Create GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --generate-notes
